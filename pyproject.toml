[project]
name = "asd-train"
version = "0.1.0"
description = "Training code for the ASD eye-tracking scanpath classifiers (InceptionV3, GhostNet/CBAM variants)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "tensorflow>=2.16",
    "keras-tuner>=1.4",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "numpy>=1.26",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asd_train"]

[tool.uv]
package = true
